    types: [created]
  workflow_run:
    types: [completed]
    workflows:
      - factory-step
      - factory-grill-copilot
      - factory-grill-claude
      - factory-grill-codex
      - factory-driver-copilot
      - factory-driver-claude
      - factory-driver-codex
      - factory-plan-copilot
      - factory-plan-claude
      - factory-plan-codex
      - factory-build-copilot
      - factory-build-claude
      - factory-build-codex
      - factory-audit-copilot
      - factory-audit-claude
      - factory-audit-codex
concurrency:
  group: factory-orchestrator-${{ github.event.issue.number || github.event.workflow_run.display_title }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  orchestrate:
    if: github.event_name == 'workflow_run' || contains(github.event.issue.labels.*.name, 'factory')
    runs-on: ubuntu-latest
    steps:
