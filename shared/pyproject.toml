[project]
name = "factory-shared"
version = "0.1.0"
description = "Shared core of the AI software factory: tests-as-data runner, guard, gates, agent runners, channels"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
  "pydantic>=2.6",
  "hypothesis>=6",
  "gherkin-official>=29",
  "httpx>=0.27",
]

[project.optional-dependencies]
teams = [
  "microsoft-agents-hosting-aiohttp>=1.0",
  "microsoft-agents-authentication-msal>=1.0",
  "aiohttp>=3.9",
]

[project.scripts]
tad = "factory_core.tad_runner.cli:main"
factory-guard = "factory_core.guard.cli:main"
factory-gates = "factory_core.gates.cli:main"
factory-spec = "factory_core.spec.cli:main"
pymut = "factory_core.mutation.pymut:main"
factory-chat = "factory_channels.cli_chat.app:main"
factory-teams-bot = "factory_channels.teams_bot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory_core", "factory_channels"]
