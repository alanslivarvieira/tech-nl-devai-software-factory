# FACTORY_CONFIG=/path/to/this.yaml — thresholds live here, never in target repos.
diff_coverage_threshold: 80
mutation_threshold: 70
max_mutants: 150
stall_limit: 3        # identical failure fingerprint N times -> ask the human (continue / amend / abort)
max_iterations: 0     # 0 = keep looping until green (the stall breaker still applies)
gate_timeout_s: 900
default_engine: copilot
run_setup: true
