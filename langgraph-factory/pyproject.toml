[project]
name = "factory-langgraph"
version = "0.1.0"
description = "AI software factory — LangGraph implementation (grill -> freeze -> plan -> build -> verify loop -> PR)"
requires-python = ">=3.11"
dependencies = [
  "factory-shared",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "docker>=7",
]

[project.scripts]
factory-app = "factory_app.api.server:main"
factory-run = "factory_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_app"]
